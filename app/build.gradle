plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mohamedgamal.masareef'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mohamedgamal.masareef'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'com.mohamedgamal.masareef.ReconciliationTest'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}
