plugins {
    id 'com.android.application'
}

// Dependency-free JVM fixture integrity gate. This does not claim semantic parser coverage yet.
def parserCorpusClasses = layout.buildDirectory.dir('parser-corpus/classes')
tasks.register('compileParserCorpusChecks', JavaCompile) {
    source rootProject.files('tools/ParserCorpusFixture.java', 'tools/ParserCorpusTest.java')
    destinationDirectory = parserCorpusClasses
    classpath = files()
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
def parserCorpusCheck = tasks.register('parserCorpusCheck', JavaExec) {
    dependsOn tasks.named('compileParserCorpusChecks')
    classpath = files(parserCorpusClasses)
    mainClass = 'com.mohamedgamal.masareef.ParserCorpusTest'
    workingDir rootProject.projectDir
    args rootProject.file('tools/fixtures/parser-corpus.tsv').absolutePath
    inputs.file(rootProject.file('tools/fixtures/parser-corpus.tsv'))
}
tasks.named('preBuild').configure { dependsOn parserCorpusCheck }
tasks.named('check').configure { dependsOn parserCorpusCheck }

android {
    namespace 'com.mohamedgamal.masareef'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.mohamedgamal.masareef'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '0.3.4'
        manifestPlaceholders = [appLabel: 'Follow Money']
        testInstrumentationRunner 'com.mohamedgamal.masareef.ReconciliationTest'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    def uploadSigning = [
        file: System.getenv('FOLLOW_MONEY_UPLOAD_KEYSTORE'),
        storePassword: System.getenv('FOLLOW_MONEY_UPLOAD_STORE_PASSWORD'),
        alias: System.getenv('FOLLOW_MONEY_UPLOAD_KEY_ALIAS'),
        keyPassword: System.getenv('FOLLOW_MONEY_UPLOAD_KEY_PASSWORD')
    ]
    def providedSigningValues = uploadSigning.values().count { it != null && !it.isBlank() }
    if (providedSigningValues != 0 && providedSigningValues != uploadSigning.size()) {
        throw new GradleException('Set all four FOLLOW_MONEY_UPLOAD_* signing variables, or unset them for an unsigned validation build.')
    }
    if (providedSigningValues == uploadSigning.size()) {
        signingConfigs {
            upload {
                storeFile file(uploadSigning.file)
                storePassword uploadSigning.storePassword
                keyAlias uploadSigning.alias
                keyPassword uploadSigning.keyPassword
            }
        }
    }
    def betaSigning = [
        file: System.getenv('FOLLOW_MONEY_BETA_KEYSTORE'),
        storePassword: System.getenv('FOLLOW_MONEY_BETA_STORE_PASSWORD'),
        alias: System.getenv('FOLLOW_MONEY_BETA_KEY_ALIAS'),
        keyPassword: System.getenv('FOLLOW_MONEY_BETA_KEY_PASSWORD')
    ]
    def providedBetaValues = betaSigning.values().count { it != null && !it.isBlank() }
    if (providedBetaValues != 0 && providedBetaValues != betaSigning.size()) {
        throw new GradleException('Set all four FOLLOW_MONEY_BETA_* signing variables, or unset them for an unsigned validation build.')
    }
    if (providedBetaValues == betaSigning.size()) {
        signingConfigs {
            beta {
                storeFile file(betaSigning.file)
                storePassword betaSigning.storePassword
                keyAlias betaSigning.alias
                keyPassword betaSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (providedSigningValues == uploadSigning.size()) signingConfig signingConfigs.upload
        }
        beta {
            initWith release
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
            manifestPlaceholders = [appLabel: 'Follow Money Beta']
            debuggable false
            // Never inherit the Play upload key from release.
            signingConfig = providedBetaValues == betaSigning.size() ? signingConfigs.beta : null
        }
    }

}
